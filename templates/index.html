<!DOCTYPE html>
<html>
<head>
    <title>TrackSmart</title>
    <!-- CSS styling for a clean, professional appearance -->
    <style>
        /* Basic page layout and typography */
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Container for organizing forms */
        .form-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .form-section {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
        
        .form-section h3 {
            margin-top: 0;
            color: #495057;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        
        /* Form styling */
        form {
            margin-bottom: 15px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #495057;
        }
        
        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        input[type="text"]:focus, input[type="date"]:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
        }
        
        /* Button styling */
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        
        /* Styling for result display boxes */
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        
        /* Green styling for successful results */
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        /* Red styling for error messages */
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            .form-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Main page header -->
    <h1>TrackSmart - Job Application Tracker</h1>
    
    <!-- Forms container with all tracker functions -->
    <div class="form-container">
        <!-- Add Job Application Form -->
        <div class="form-section">
            <h3>Add New Job Application</h3>
            <form action="/add-job" method="post">
                <div class="form-group">
                    <label for="job_title">Job Title:</label>
                    <input type="text" id="job_title" name="job_title" required>
                </div>
                <div class="form-group">
                    <label for="company">Company:</label>
                    <input type="text" id="company" name="company" required>
                </div>
                <div class="form-group">
                    <label for="date_applied">Date Applied:</label>
                    <input type="date" id="date_applied" name="date_applied" required>
                </div>
                <div class="form-group">
                    <label for="status">Status:</label>
                    <input type="text" id="status" name="status" placeholder="e.g., Applied, Interview, Rejected" required>
                </div>
                <button type="submit">Add Job Application</button>
            </form>
        </div>
        
        <!-- View Jobs Form -->
        <div class="form-section">
            <h3>View All Applications</h3>
            <form action="/view-jobs" method="post">
                <button type="submit">View All Jobs</button>
            </form>
        </div>
        
        <!-- Update Status Form -->
        <div class="form-section">
            <h3>Update Job Status</h3>
            <form action="/update-status" method="post">
                <div class="form-group">
                    <label for="row_number">Row Number:</label>
                    <input type="text" id="row_number" name="row_number" placeholder="Enter row number to update" required>
                </div>
                <div class="form-group">
                    <label for="new_status">New Status:</label>
                    <input type="text" id="new_status" name="new_status" placeholder="e.g., Interview, Hired, Rejected" required>
                </div>
                <button type="submit">Update Status</button>
            </form>
        </div>
        
        <!-- Send Reminders Form -->
        <div class="form-section">
            <h3>Send Follow-up Reminders</h3>
            <form action="/send-reminders" method="post">
                <button type="submit">Send Reminders</button>
            </form>
        </div>
    </div>
    
    <!-- Display successful results if available -->
    {% if success and result %}
    <div class="result success">
        <h3>Tracker Results:</h3>
        <!-- Use <pre> tag to preserve formatting of output -->
        <pre>{{ result }}</pre>
    </div>
    {% endif %}
    
    <!-- Display error messages if something went wrong -->
    {% if not success and error %}
    <div class="result error">
        <h3>Error:</h3>
        <p>{{ error }}</p>
    </div>
    {% endif %}
</body>
</html>
